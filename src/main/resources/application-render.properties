# Exigir credenciais da base, sem recorrer à configuração de desenvolvimento.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true

# A criação do primeiro administrador é uma operação explícita e temporária.
app.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.bootstrap.username=${ADMIN_USER:}
app.bootstrap.password=${ADMIN_PASSWORD:}
