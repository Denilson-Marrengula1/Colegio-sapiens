name: Testes

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: colegio_sapiens_test
          MYSQL_USER: colegio_test
          MYSQL_PASSWORD: test-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptest-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testar com H2 e MySQL
        run: mvn -B test
        env:
          RUN_MYSQL_TESTS: 'true'
          MYSQL_TEST_URL: 'jdbc:mysql://127.0.0.1:3306/colegio_sapiens_test?allowPublicKeyRetrieval=true&useSSL=false&connectionTimeZone=UTC'
          MYSQL_TEST_USER: colegio_test
          MYSQL_TEST_PASSWORD: test-only-password
